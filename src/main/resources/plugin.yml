name: PlexonBackpacks
version: '2.0.0-rc.2'
main: com.zpkdxgames.plexonbackpacks.PlexonBackpacksPlugin
description: Premium item-safe tiered backpack storage for the Plexon ecosystem.
author: ZpkDxGames
website: https://github.com/ZpkDxGames/PlexonBackpacks
api-version: '26.2'
softdepend:
  - PlexonCore
  - Vault
  - PlaceholderAPI

commands:
  backpack:
    description: Open and manage PlexonBackpacks.
    usage: /backpack [open|upgrade|tiers|inspect|gui|give|recover|repair|forceclose|reload|save|diagnostics]
    aliases: [backpacks, bp]
    permission: plexonbackpacks.use

permissions:
  plexonbackpacks.use:
    description: Open backpacks and use the main command.
    default: true
  plexonbackpacks.craft:
    description: Craft configured backpacks.
    default: true
  plexonbackpacks.upgrade:
    description: Upgrade an owned backpack to its next configured tier.
    default: true
  plexonbackpacks.give:
    description: Give backpacks to players.
    default: op
  plexonbackpacks.admin-gui:
    description: Open the administrative backpack giver GUI.
    default: op
  plexonbackpacks.inspect-any:
    description: Inspect authoritative backpack state by UUID.
    default: op
  plexonbackpacks.force-close:
    description: Force-close a backpack session through the authoritative service.
    default: op
  plexonbackpacks.recover:
    description: Recover a physical reference to an existing backpack UUID.
    default: op
  plexonbackpacks.repair:
    description: Repair a proven backpack reference from authoritative state.
    default: op
  plexonbackpacks.reload:
    description: Reload PlexonBackpacks.
    default: op
  plexonbackpacks.save:
    description: Force-save backpack data.
    default: op
  plexonbackpacks.diagnostics:
    description: View PlexonBackpacks persistence/publication diagnostics.
    default: op
  plexonbackpacks.bypass-owner:
    description: Open or upgrade backpacks owned by another player.
    default: op
  plexonbackpacks.admin:
    description: Grants every PlexonBackpacks administrative permission.
    default: op
    children:
      plexonbackpacks.admin-gui: true
      plexonbackpacks.give: true
      plexonbackpacks.inspect-any: true
      plexonbackpacks.force-close: true
      plexonbackpacks.recover: true
      plexonbackpacks.repair: true
      plexonbackpacks.reload: true
      plexonbackpacks.save: true
      plexonbackpacks.diagnostics: true
      plexonbackpacks.bypass-owner: true
