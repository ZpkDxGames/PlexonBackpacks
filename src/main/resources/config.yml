# PlexonBackpacks 2.0.0-rc.1
# MiniMessage formatting: https://docs.papermc.io/adventure/minimessage/format/

config-version: 3

settings:
  # When enabled, a crafted backpack binds to the first player who opens it.
  ownership-enabled: true
  bind-on-first-open: true

  # Premium storage controls.
  quick-deposit-enabled: true
  upgrades-enabled: true

  # Backpack contents stay authoritative in memory. Changed records are encoded
  # on the primary thread and coalesced for asynchronous disk append.
  autosave-interval-ticks: 200
  csv-compaction-threshold-updates: 10000

  # Automatically unlock configured crafting recipes for players.
  discover-recipes: true

messages:
  prefix: "<gradient:#46d3ff:#8b5cf6><bold>PlexonBackpacks</bold></gradient> <dark_gray>»</dark_gray> "
  no-permission: "<prefix><red>You do not have permission to do that."
  players-only: "<prefix><red>Only players can use this command."
  held-required: "<prefix><yellow>Hold a Plexon backpack in either hand first."
  reference-required: "<prefix><yellow>Keep this backpack item in your inventory to continue."
  invalid-tier: "<prefix><red>Unknown tier <white><tier></white>. Use <white>/backpack tiers</white>."
  invalid-amount: "<prefix><red>The amount must be between 1 and 64."
  invalid-uuid: "<prefix><red><id></red> is not a valid backpack UUID."
  uuid-required: "<prefix><yellow>A backpack UUID is required."
  player-not-found: "<prefix><red>Player <white><player></white> is not online."
  gave: "<prefix><green>Gave <white><amount>x <tier></white> to <white><player></white>."
  received: "<prefix><green>You received <white><amount>x <tier></white>."
  inventory-space: "<prefix><yellow><player> needs <white><amount></white> free inventory slot(s); nothing was dropped."
  admin-gui-given: "<prefix><green>You received one unbound <white><tier></white> backpack."
  author-link: "<prefix><gradient:#f59e0b:#8b5cf6>Created by ZpkDxGames</gradient> <dark_gray>—</dark_gray> <click:open_url:'https://namemc.com/profile/ZpkDxGames.1'><hover:show_text:'<yellow>Open the author profile'><aqua><underlined>View NameMC profile</underlined></aqua></hover></click>"
  already-open: "<prefix><yellow>You already have a backpack open. Close it before opening another."
  in-use: "<prefix><red>Another player is using this backpack right now."
  bound: "<prefix><green>This backpack is now bound to you."
  wrong-owner: "<prefix><red>This backpack belongs to <white><owner></white>."
  invalid-backpack: "<prefix><red>This backpack cannot be opened because its tier is unavailable."
  missing-state: "<prefix><red>This backpack's saved contents are unavailable. Nothing was reset; ask staff for help."
  persistence-failed: "<prefix><red>Your backpack could not be saved safely. The action was stopped and your storage remains protected."
  operation-failed: "<prefix><red>That backpack action could not be completed safely. Try again or ask staff for help."
  backpack-changed: "<prefix><yellow>This backpack changed while the menu was open. The latest information has been restored."
  protected-interaction: "<prefix><yellow>That inventory interaction is disabled while a backpack is open."
  cursor-busy: "<prefix><yellow>Place the item on your cursor into an inventory slot before changing pages or using a backpack action."
  cannot-nest: "<prefix><red>Backpacks can't be stored inside another backpack. Keep them in your player inventory or a normal container."
  cannot-place: "<prefix><yellow>Backpack heads cannot be placed as blocks."
  crafted-one-at-a-time: "<prefix><yellow>Backpacks must be crafted one at a time."
  craft-no-permission: "<prefix><red>You cannot craft that backpack tier."
  quick-deposit: "<prefix><green>Moved <white><amount></white> item(s) into this backpack."
  quick-deposit-none: "<prefix><gray>Nothing moved. The backpack may be full or your inventory has no eligible items."
  upgrades-disabled: "<prefix><yellow>Backpack upgrades are disabled."
  upgrade-open: "<prefix><yellow>Close this backpack before upgrading it."
  max-tier: "<prefix><aqua>This backpack is already at the maximum tier."
  economy-unavailable: "<prefix><red>Paid backpack upgrades are temporarily unavailable."
  upgrade-insufficient: "<prefix><yellow>You need <white><cost></white> for this upgrade."
  upgrade-charge-failed: "<prefix><red>The payment could not be completed; the backpack was not changed."
  upgrade-failed: "<prefix><red>The upgrade could not be completed. Your backpack was restored and any completed payment was refunded."
  upgrade-success: "<prefix><green>Upgraded to <white><tier></white> (<white><slots></white> slots) for <white><cost></white>."
  recover-confirm: "<prefix><yellow>Recovery creates another physical reference to existing state. Run <white>/backpack recover <id> confirm</white> to continue."
  recover-success: "<prefix><green>Recovered a reference to backpack <white><id></white>."
  recover-failed: "<prefix><red>Backpack <white><id></white> cannot be recovered (missing state or active session)."
  repair-success: "<prefix><green>Refreshed this item's metadata from authoritative backpack state."
  repair-failed: "<prefix><red>Metadata repair was refused because its UUID could not be proven against stored state."
  force-close-confirm: "<prefix><yellow>Force-closing can interrupt an active custody session. Run <white>/backpack forceclose <id> confirm</white> within 30 seconds to continue."
  force-close-success: "<prefix><green>Backpack <white><id></white> has no remaining authoritative session."
  force-close-failed: "<prefix><red>Backpack <white><id></white> could not be safely force-closed; state remains locked."
  reloaded: "<prefix><green>Configuration and recipes reloaded."
  reload-failed: "<prefix><red>Reload failed. Check the console; the previous tier setup is still active."
  saved: "<prefix><green>All backpack data has been synchronously saved."
  tiers-header: "<prefix><white>Available tiers:"
  tier-line: "<gray> • <tier> <dark_gray>—</dark_gray> <white><slots> slots"
  inspect: "<prefix><gray>ID: <white><id></white> | Tier: <white><tier></white> | Owner: <white><owner></white> | Capacity: <white><slots></white> | Session: <white><session></white> | Last access: <white><last></white>"
  help:
    - "<gradient:#46d3ff:#8b5cf6><bold>PlexonBackpacks</bold></gradient> <gray>2.0"
    - "<gray>/backpack <white>— Open the backpack in your hand"
    - "<gray>/backpack upgrade <white>— Preview the next backpack upgrade"
    - "<gray>/backpack tiers <white>— List configured tiers"

# Tiers stay ordered. An upgrade moves only to the next configured tier.
# `upgrade-cost` is the price to upgrade INTO this tier. Vault/TheosisEconomy is
# authoritative when a non-zero cost is configured. PlexonBackpacks has no balance.
# Each tier needs 9–54 slots in multiples of nine.
