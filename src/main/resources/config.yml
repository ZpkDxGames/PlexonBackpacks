# PlexonBackpacks 1.1.0
# MiniMessage formatting: https://docs.papermc.io/adventure/minimessage/format/

config-version: 2

settings:
  # When enabled, a crafted backpack binds to the first player who opens it.
  ownership-enabled: true
  bind-on-first-open: true

  # Backpack contents stay in memory. Only changed backpacks are serialized,
  # then appended to CSV by an asynchronous writer.
  # 200 ticks = 10 seconds. Set to 0 to disable periodic saves.
  autosave-interval-ticks: 200
  # Compact the append-only CSV after this many superseded rows. Compaction is
  # asynchronous and uses an atomic file replacement.
  csv-compaction-threshold-updates: 10000

  # Automatically unlock configured crafting recipes for players.
  discover-recipes: true

messages:
  prefix: "<gradient:#46d3ff:#8b5cf6><bold>PlexonBackpacks</bold></gradient> <dark_gray>»</dark_gray> "
  no-permission: "<prefix><red>You do not have permission to do that."
  players-only: "<prefix><red>Only players can use this command."
  held-required: "<prefix><yellow>Hold a Plexon backpack in either hand first."
  invalid-tier: "<prefix><red>Unknown tier <white><tier></white>. Use <white>/backpack tiers</white>."
  invalid-amount: "<prefix><red>The amount must be between 1 and 64."
  player-not-found: "<prefix><red>Player <white><player></white> is not online."
  gave: "<prefix><green>Gave <white><amount>x <tier></white> to <white><player></white>."
  received: "<prefix><green>You received <white><amount>x <tier></white>."
  admin-gui-given: "<prefix><green>You received one unbound <white><tier></white> backpack."
  author-link: "<prefix><gradient:#f59e0b:#8b5cf6>Created by ZpkDxGames</gradient> <dark_gray>—</dark_gray> <click:open_url:'https://namemc.com/profile/ZpkDxGames.1'><hover:show_text:'<yellow>Open the author profile'><aqua><underlined>View NameMC profile</underlined></aqua></hover></click>"
  dropped-overflow: "<prefix><yellow>Your inventory was full, so the remaining backpack was dropped at your feet."
  already-open: "<prefix><yellow>You already have a backpack open."
  in-use: "<prefix><red>That backpack is currently being used by another player."
  bound: "<prefix><green>This backpack is now bound to you."
  wrong-owner: "<prefix><red>This backpack belongs to <white><owner></white>."
  invalid-backpack: "<prefix><red>This backpack is invalid or its tier no longer exists."
  cannot-nest: "<prefix><red>Backpacks cannot be stored inside another backpack."
  cannot-place: "<prefix><yellow>Backpack heads cannot be placed as blocks."
  crafted-one-at-a-time: "<prefix><yellow>Backpacks must be crafted one at a time to keep every storage ID unique."
  craft-no-permission: "<prefix><red>You cannot craft that backpack tier."
  reloaded: "<prefix><green>Configuration and recipes reloaded."
  reload-failed: "<prefix><red>Reload failed. Check the console; the previous tier setup is still active."
  saved: "<prefix><green>All backpack data has been saved."
  tiers-header: "<prefix><white>Available tiers:"
  tier-line: "<gray> • <tier> <dark_gray>—</dark_gray> <white><slots> slots"
  inspect: "<prefix><gray>ID: <white><id></white> | Tier: <tier> <gray>| Owner: <white><owner></white> | Slots: <white><slots></white>"
  help:
    - "<gradient:#46d3ff:#8b5cf6><bold>PlexonBackpacks</bold></gradient>"
    - "<gray>/backpack <white>— Open the backpack in your hand"
    - "<gray>/backpack tiers <white>— List configured tiers"
    - "<gray>/backpack inspect <white>— Inspect the backpack in your hand"
    - "<gray>/backpack gui <white>— Open the OP/admin giver GUI"
    - "<gray>/backpack give <player> <tier> [amount] <white>— Admin give"
    - "<gray>/backpack reload <white>— Reload configuration"
    - "<gray>/backpack save <white>— Save all data now"

