name: Release

on:
  push:
    tags:
      - v2.0.0-rc.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Provision verified PlexonCore API
        run: bash scripts/provision-core.sh

      - name: Build and test exact tag
        run: gradle clean test check jar --no-daemon

      - name: Report exact-tag test count
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in glob.glob('build/test-results/test/TEST-*.xml'):
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          print(f'TEST_COUNT={tests} FAILURES={failures} ERRORS={errors} SKIPPED={skipped}')
          if failures or errors or tests == 0:
              raise SystemExit(1)
          PY

      - name: Verify release payload and isolation
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonBackpacks-2.0.0-rc.1.jar"
          test -f "$JAR"
          unzip -p "$JAR" plugin.yml | grep -F "version: '2.0.0-rc.1'"
          jar tf "$JAR" | grep -F 'com/zpkdxgames/plexonbackpacks/PlexonBackpacksPlugin.class'
          if jar tf "$JAR" | grep -q '^com/zpkdxgames/plexoncore/'; then
            echo "PlexonCore classes were shaded into PlexonBackpacks" >&2
            exit 1
          fi
          if jar tf "$JAR" | grep -q '^net/milkbowl/vault/'; then
            echo "Vault classes were shaded into PlexonBackpacks" >&2
            exit 1
          fi
          javap -verbose -classpath "$JAR" com.zpkdxgames.plexonbackpacks.PlexonBackpacksPlugin \
            | grep -F 'major version: 69'
          sha256sum "$JAR" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/libs/PlexonBackpacks-2.0.0-rc.1.jar \
            SHA256SUMS.txt \
            --verify-tag \
            --prerelease \
            --title "PlexonBackpacks 2.0.0-rc.1" \
            --notes-file .release/RELEASE_NOTES_2.0.0-rc.1.md
