name: Publish PlexonBackpacks 1.2.1 once

on:
  push:
    branches:
      - release/1.2.0
    paths:
      - '.github/workflows/publish-1.2.1-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Provision verified PlexonCore 2.0.4 API
        run: bash scripts/provision-core.sh

      - name: Build and test exact merged commit
        run: gradle clean test check jar --no-daemon

      - name: Verify release payload
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonBackpacks-1.2.1.jar"
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -F "version: '1.2.1'"
          if jar tf "$JAR" | grep -q '^com/zpkdxgames/plexoncore/'; then
            echo "PlexonCore classes were shaded into PlexonBackpacks" >&2
            exit 1
          fi
          sha256sum "$JAR" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish immutable v1.2.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.2.1 >/dev/null 2>&1; then
            echo 'v1.2.1 already exists; refusing to replace immutable release assets.'
            exit 0
          fi
          gh release create v1.2.1 \
            build/libs/PlexonBackpacks-1.2.1.jar \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'PlexonBackpacks 1.2.1' \
            --notes-file .release/RELEASE_NOTES_1.2.1.md
