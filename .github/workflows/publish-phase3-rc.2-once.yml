name: Publish PlexonBackpacks 2.0.0-rc.2 once

on:
  push:
    branches:
      - phase3/release-v2.0.0-rc.2
    paths:
      - '.github/workflows/publish-phase3-rc.2-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prove accepted Phase 3 ancestry and release-only delta
        run: |
          set -euo pipefail
          ACCEPTED=594c773e4cc4a696ce790a61b70dc8074f5f0c05
          git merge-base --is-ancestor "$ACCEPTED" HEAD
          git diff --name-only "$ACCEPTED" HEAD | tee /tmp/release-delta.txt
          if grep -Ev '^(build\.gradle\.kts|pom\.xml|src/main/resources/plugin\.yml|\.github/workflows/ci\.yml|\.github/workflows/publish-phase3-rc\.2-once\.yml|\.release/RELEASE_NOTES_2\.0\.0-rc\.2\.md)$' /tmp/release-delta.txt | grep -q .; then
            echo 'Non-release-only file changed after accepted Phase 3 SHA.' >&2
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Provision verified PlexonCore API
        run: bash scripts/provision-core.sh

      - name: Build and test exact candidate
        run: gradle clean test check jar --no-daemon

      - name: Report exact-candidate test count
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in glob.glob('build/test-results/test/TEST-*.xml'):
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          print(f'TEST_COUNT={tests} FAILURES={failures} ERRORS={errors} SKIPPED={skipped}')
          if failures or errors or skipped or tests == 0:
              raise SystemExit(1)
          PY

      - name: Verify production payload and dependency isolation
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonBackpacks-2.0.0-rc.2.jar"
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -F "version: '2.0.0-rc.2'"
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
          jar tf "$JAR" | grep -F 'com/zpkdxgames/plexonbackpacks/PlexonBackpacksPlugin.class'
          if jar tf "$JAR" | grep -q '^com/zpkdxgames/plexoncore/'; then exit 1; fi
          if jar tf "$JAR" | grep -q '^net/milkbowl/vault/'; then exit 1; fi
          if jar tf "$JAR" | grep -q '^me/clip/placeholderapi/'; then exit 1; fi
          javap -verbose -classpath "$JAR" com.zpkdxgames.plexonbackpacks.PlexonBackpacksPlugin | grep -F 'major version: 69'
          sha256sum "$JAR" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v2.0.0-rc.2
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to reuse or move it." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG release already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" \
            build/libs/PlexonBackpacks-2.0.0-rc.2.jar \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'PlexonBackpacks 2.0.0-rc.2' \
            --notes-file .release/RELEASE_NOTES_2.0.0-rc.2.md
