name: CI

on:
  push:
    branches:
      - main
      - release/1.2.0
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Provision verified PlexonCore API
        run: bash scripts/provision-core.sh

      - name: Build and test
        run: gradle clean test check jar --no-daemon

      - name: Verify release JAR
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonBackpacks-1.2.0.jar"
          test -f "$JAR"
          unzip -p "$JAR" plugin.yml | grep -F "version: '1.2.0'"
          if jar tf "$JAR" | grep -q '^com/zpkdxgames/plexoncore/'; then
            echo "PlexonCore classes were shaded into PlexonBackpacks" >&2
            exit 1
          fi
          git diff --check HEAD^ HEAD
          sha256sum "$JAR" > SHA256SUMS.txt

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: PlexonBackpacks-1.2.0
          path: |
            build/libs/PlexonBackpacks-1.2.0.jar
            SHA256SUMS.txt
          if-no-files-found: error
