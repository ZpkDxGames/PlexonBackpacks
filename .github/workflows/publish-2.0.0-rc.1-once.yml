name: Publish PlexonBackpacks 2.0.0 RC1 once

on:
  push:
    branches:
      - agent/publish-backpacks-2.0.0-rc.1-once
    paths:
      - '.github/workflows/publish-2.0.0-rc.1-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ddaa3034e310467a9c9f2351f5ff6fb0cd99dbe5
      TAG: v2.0.0-rc.1
      JAR: build/libs/PlexonBackpacks-2.0.0-rc.1.jar
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@v5
        with:
          ref: ddaa3034e310467a9c9f2351f5ff6fb0cd99dbe5
          fetch-depth: 0

      - name: Assert frozen source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Provision verified PlexonCore API
        run: bash scripts/provision-core.sh

      - name: Build and test frozen candidate
        run: gradle clean test check jar --no-daemon

      - name: Report exact test count
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in glob.glob('build/test-results/test/TEST-*.xml'):
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          print(f'TEST_COUNT={tests} FAILURES={failures} ERRORS={errors} SKIPPED={skipped}')
          if failures or errors or tests < 59:
              raise SystemExit(1)
          PY

      - name: Verify distribution isolation and Java 25 bytecode
        run: |
          set -euo pipefail
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -F "version: '2.0.0-rc.1'"
          jar tf "$JAR" | grep -F 'com/zpkdxgames/plexonbackpacks/PlexonBackpacksPlugin.class'
          if jar tf "$JAR" | grep -q '^com/zpkdxgames/plexoncore/'; then
            echo 'PlexonCore classes were shaded into PlexonBackpacks' >&2
            exit 1
          fi
          if jar tf "$JAR" | grep -q '^net/milkbowl/vault/'; then
            echo 'Vault classes were shaded into PlexonBackpacks' >&2
            exit 1
          fi
          javap -verbose -classpath "$JAR" com.zpkdxgames.plexonbackpacks.PlexonBackpacksPlugin \
            | grep -F 'major version: 69'

      - name: Verify source and generate checksum
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD origin/main)"
          git diff --check "$BASE" HEAD
          sha256sum "$JAR" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt
          stat -c 'JAR_SIZE=%s' "$JAR"

      - name: Publish immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to replace an RC release." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG tag already exists without the expected release; refusing mutation." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "$JAR" \
            SHA256SUMS.txt \
            --target "$CANDIDATE_SHA" \
            --prerelease \
            --title 'PlexonBackpacks 2.0.0-rc.1' \
            --notes-file .release/RELEASE_NOTES_2.0.0-rc.1.md

      - name: Verify published tag and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$TAG_SHA" = "$CANDIDATE_SHA"
          test "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" = 'true'
          test "$(gh release view "$TAG" --json tagName --jq '.tagName')" = "$TAG"

          rm -rf release-verify
          mkdir release-verify
          gh release download "$TAG" --dir release-verify
          test -s "release-verify/PlexonBackpacks-2.0.0-rc.1.jar"
          test -s release-verify/SHA256SUMS.txt

          EXPECTED_SHA="$(awk '{print $1}' SHA256SUMS.txt)"
          RELEASE_SHA="$(sha256sum release-verify/PlexonBackpacks-2.0.0-rc.1.jar | awk '{print $1}')"
          test "$RELEASE_SHA" = "$EXPECTED_SHA"
          grep -F "$EXPECTED_SHA  build/libs/PlexonBackpacks-2.0.0-rc.1.jar" release-verify/SHA256SUMS.txt

          EXPECTED_SIZE="$(stat -c %s "$JAR")"
          RELEASE_SIZE="$(stat -c %s release-verify/PlexonBackpacks-2.0.0-rc.1.jar)"
          test "$RELEASE_SIZE" = "$EXPECTED_SIZE"

          echo "TAG_SHA=$TAG_SHA"
          echo "JAR_SHA256=$RELEASE_SHA"
          echo "JAR_SIZE=$RELEASE_SIZE"
          gh release view "$TAG" --json tagName,isPrerelease,targetCommitish,assets,url
