name: Publish PlexonBackpacks 1.2.0 Once

on:
  push:
    branches:
      - release/1.2.0
    paths:
      - .github/workflows/publish-1.2.0-once.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Provision verified PlexonCore API
        run: bash scripts/provision-core.sh

      - name: Build and test release
        run: gradle clean test check jar --no-daemon

      - name: Verify release payload
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonBackpacks-1.2.0.jar"
          test -f "$JAR"
          unzip -p "$JAR" plugin.yml | grep -F "version: '1.2.0'"
          if jar tf "$JAR" | grep -q '^com/zpkdxgames/plexoncore/'; then
            echo "PlexonCore classes were shaded into PlexonBackpacks" >&2
            exit 1
          fi
          sha256sum "$JAR" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo "Release v1.2.0 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v1.2.0 \
            build/libs/PlexonBackpacks-1.2.0.jar \
            SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "PlexonBackpacks 1.2.0" \
            --notes-file .release/RELEASE_NOTES_1.2.0.md
